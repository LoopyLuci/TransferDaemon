name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 6 * * 1'  # weekly security audit

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

# The Cargo workspace lives in `transferdaemon/` (the repo root holds the
# android/ + ios/ shells and tooling).
defaults:
  run:
    working-directory: transferdaemon

# rfd (native dialogs, desktop) pulls the GTK/glib bindings on Linux, and
# `--all-features` enables every crate feature (incl. transferd-core's
# tor-transport). Every cargo job needs the system glib/GTK headers.
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libappindicator3-dev libglib2.0-dev libasound2-dev libpulse-dev libxdo-dev libv4l-dev
      - run: cargo check --workspace --all-features

  fmt:
    runs-on: ubuntu-latest
    continue-on-error: true  # repo-wide `cargo fmt` sweep not yet applied; informational until then
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: rustfmt
      - run: cargo fmt --check

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libappindicator3-dev libglib2.0-dev libasound2-dev libpulse-dev libxdo-dev libv4l-dev
      - run: cargo test --workspace --all-features

  clippy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          components: clippy
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libappindicator3-dev libglib2.0-dev libasound2-dev libpulse-dev libxdo-dev libv4l-dev
      - run: cargo clippy --workspace --all-features -- -D warnings

  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libappindicator3-dev libglib2.0-dev libasound2-dev libpulse-dev libxdo-dev libv4l-dev
      - run: cargo build --release --workspace
      - uses: actions/upload-artifact@v4
        with:
          name: transferd-${{ matrix.os }}
          path: target/release/transferd*

  bench:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: sudo apt-get update && sudo apt-get install -y libgtk-3-dev libappindicator3-dev libglib2.0-dev libasound2-dev libpulse-dev libxdo-dev libv4l-dev
      - run: cargo bench --workspace

  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      # Deterministic adversarial-input sweep over every untrusted parser.
      # A panic anywhere returns a non-zero exit and fails the build.
      - run: cargo run --release -p transferd-pentest -- fuzz 2000000

  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
      - run: cargo install cargo-audit
        env:
          RUSTFLAGS: ''  # do not treat third-party warnings as errors
      - run: cargo audit