[workspace]
resolver = "2"
members = ["crates/harbor-core", "crates/harbor-providers", "crates/harbor"]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/LoopyLuci/TransferDaemon"

[workspace.dependencies]
harbor-core      = { path = "crates/harbor-core" }
harbor-providers = { path = "crates/harbor-providers" }

tokio      = { version = "1", features = ["full"] }
serde      = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror  = "1"
regex      = "1"
globset    = "0.4"
sha2       = "0.10"
rand       = "0.8"
base64     = "0.22"
async-trait = "0.1"
tracing    = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }

[profile.release]
lto = true
codegen-units = 1