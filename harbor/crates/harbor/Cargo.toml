[package]
name = "harbor"
description = "Harbor — a capability-gated MCP server for safe, audit-trailed computer control (PowerShell + files)"
version.workspace = true
edition.workspace = true
license.workspace = true

[[bin]]
name = "harbor"
path = "src/main.rs"

[dependencies]
harbor-core      = { workspace = true }
harbor-providers = { workspace = true }
tokio            = { workspace = true }
serde            = { workspace = true }
serde_json       = { workspace = true }
thiserror        = { workspace = true }
globset          = { workspace = true }
rand             = { workspace = true }
toml             = "0.8"
tracing          = { workspace = true }
tracing-subscriber = { workspace = true }

[dev-dependencies]
tempfile = "3"
harbor-core = { workspace = true }