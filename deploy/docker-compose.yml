# Hosted TransferDaemon relay stack: `relayd` (blind UDP relay), `relayd-ws`
# (blind WebSocket relay) + `dhtd` (DHT bootstrap node) for peers on the
# public Internet.
#
#   docker compose -f deploy/docker-compose.yml up -d
#
# Set PUBLIC_IP to the VPS's public address so the DHT bootstrap advertises a
# reachable address (and so clients can publish relay:// endpoints that work).
# Open UDP 5901 (relay), TCP 5902 (relayd-ws) and UDP 7901 (DHT) on the host
# firewall. Optionally front 5902 + 5903 with the NGINX configs in deploy/nginx/.

services:
  relayd:
    build:
      context: ..
      dockerfile: deploy/relayd.Dockerfile
    image: transferd-relay
    restart: unless-stopped
    ports:
      - "5901:5901/udp"
    environment:
      # PoW difficulty = anti-abuse cost for registration. 20 (default) is a
      # good public default; raise if the relay is being flooded.
      RELAYD_PORT: "5901"
      RELAYD_DIFFICULTY: "20"
      RELAYD_TTL: "90"
      # Node transfer limits. 0 = unlimited. Set these so the node never
      # carries a blob or per-token bandwidth beyond what it can handle:
      #   RELAYD_MAX_BLOB_BYTES      hard cap on one forwarded ciphertext blob
      #   RELAYD_MAX_MB_PER_DAY      per-token daily bandwidth budget (MiB)
      #   RELAYD_MAX_MB_PER_WEEK     per-token weekly bandwidth budget (MiB)
      #   RELAYD_MAX_MB_PER_MONTH    per-token monthly bandwidth budget (MiB)
      RELAYD_MAX_BLOB_BYTES: "0"
      RELAYD_MAX_MB_PER_DAY: "0"
      RELAYD_MAX_MB_PER_WEEK: "0"
      RELAYD_MAX_MB_PER_MONTH: "0"

  relayd-ws:
    image: transferd-relay
    restart: unless-stopped
    command: ["/usr/local/bin/relayd-ws"]
    ports:
      - "5902:5902/tcp"
    environment:
      RELAYD_WS_PORT: "5902"
      RELAYD_WS_DIFFICULTY: "20"
      RELAYD_WS_TTL: "90"
      RELAYD_WS_MAX_BLOB_BYTES: "0"
      RELAYD_WS_MAX_MB_PER_DAY: "0"
      RELAYD_WS_MAX_MB_PER_WEEK: "0"
      RELAYD_WS_MAX_MB_PER_MONTH: "0"

  dhtd:
    image: transferd-relay
    restart: unless-stopped
    command: ["/usr/local/bin/dhtd"]
    ports:
      - "7901:7901/udp"
    environment:
      DHTD_BIND: "0.0.0.0:7901"
      # MUST be the VPS's public address:port, otherwise peers route to
      # 0.0.0.0 and discovery breaks.
      DHTD_ADVERTISE: "${PUBLIC_IP:-127.0.0.1}:7901"