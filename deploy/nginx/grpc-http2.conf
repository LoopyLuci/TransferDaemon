# NGINX HTTP block: gRPC over HTTP/2 + TLS for a TransferDaemon node's API.
#
# Alternative to the `stream` TLS proxy in relay-streams.conf when you want
# standard HTTP/2 (path-aware) termination instead of raw TCP. Use ONE of the
# two for the gRPC port.
#
# Requires `ngx_http_grpc_module` + `ngx_http_ssl_module` (nginx-full on
# Debian, or the official nginx image).
#
# Place inside the top-level `http { }` block, or copy to
# /etc/nginx/conf.d/daemon-grpc.conf on a fresh nginx.

upstream daemon_grpc {
    server 127.0.0.1:50051;
    keepalive 32;               # reuse the backend connection (gRPC is HTTP/2)
}

server {
    listen 50052 ssl http2;
    server_name node.example.com;

    ssl_certificate     /etc/letsencrypt/live/node.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/node.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;

    # Optionally restrict to a VPN/tailnet source range:
    # allow 100.64.0.0/10; deny all;

    client_max_body_size 0;     # gRPC has no body-size limit
    client_body_timeout 120s;

    location / {
        grpc_pass grpc://daemon_grpc;
        grpc_set_header Host $host;
        grpc_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # Daemon's Bearer auth token passes through untouched.
        grpc_set_header Authorization $http_authorization;
    }
}