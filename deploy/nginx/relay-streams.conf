# NGINX stream block: front the whole TransferDaemon relay stack behind one
# host. Terminates TLS and proxies:
#   - UDP 5901  -> relayd     (blind UDP relay)
#   - UDP 7901  -> dhtd       (DHT bootstrap)
#   - TCP 5902  -> relayd-ws  (blind WebSocket relay)
#   - TCP 5903  -> daemon gRPC (optional remote API; see grpc-http2.conf for
#                               the HTTP/2 variant — use ONE of the two)
#
# Place this in `/etc/nginx/nginx.conf` (top-level `stream { }` block) or as a
# snippet inside an existing `stream { }` block. Requires `ngx_stream_module`
# (nginx-extras / nginx-full on Debian; the official nginx image includes it).
#
#   nginx -t && systemctl reload nginx
#
# A single DNS name + Let's Encrypt (via certbot) gives peers one host to
# remember: e.g. relay.example.com. Clients then configure:
#   TRANSFERD_RELAY_ADDR=relay.example.com:5901             (UDP relay)
#   TRANSFERD_RELAY_ADDR=wss://relay.example.com:5902        (WS relay)
#   TRANSFERD_DHT_BOOTSTRAP=relay.example.com:7901           (DHT bootstrap)
#   TRANSFERD_RELAY_ADDR=wss://relay.example.com:5902 covers the Cloudflare-
#   equivalent path when the worker domain is pointed here instead.

stream {
    log_format relay '$remote_addr [$time_local] $protocol $status'
                     ' proxy_peer=$upstream_addr proxy_port=$proxy_port';
    access_log /var/log/nginx/relay.log relay;

    # ── UDP: relayd (blind datagram forwarding) ───────────────────────────────
    upstream relayd_udp {
        server 127.0.0.1:5901;
    }
    server {
        listen 5901 udp reuseport;
        proxy_pass relayd_udp;
        proxy_responses 0;      # relayd replies per-datagram; don't pair them
        proxy_timeout 120s;     # long idle keepalive windows
    }

    # ── UDP: dhtd (discovery bootstrap) ───────────────────────────────────────
    upstream dhtd_udp {
        server 127.0.0.1:7901;
    }
    server {
        listen 7901 udp reuseport;
        proxy_pass dhtd_udp;
        proxy_responses 0;
        proxy_timeout 120s;
    }

    # ── TCP/TLS: relayd-ws (WebSocket relay) ──────────────────────────────────
    # Peers connect with wss:// so the relay is usable behind strict firewalls
    # AND over Cloudflare's edge if this host sits behind it.
    upstream relayd_ws {
        server 127.0.0.1:5902;
    }
    server {
        listen 5902 ssl;
        ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
        ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
        ssl_protocols TLSv1.2 TLSv1.3;
        proxy_pass relayd_ws;
        proxy_timeout 120s;
    }

    # ── TCP/TLS: daemon gRPC (optional remote control of a node) ──────────────
    # For an always-on node you administer remotely. Use cert + client auth if
    # you expose this publicly (the daemon also enforces its Bearer auth token).
    # upstream daemon_grpc {
    #     server 127.0.0.1:50051;
    # }
    # server {
    #     listen 5903 ssl;
    #     ssl_certificate     /etc/letsencrypt/live/relay.example.com/fullchain.pem;
    #     ssl_certificate_key /etc/letsencrypt/live/relay.example.com/privkey.pem;
    #     ssl_protocols TLSv1.2 TLSv1.3;
    #     proxy_pass daemon_grpc;
    #     proxy_timeout 60s;
    # }
}