[workspace]
members = [
    "crates/transferd-store",
    "crates/transferd-pentest",
    "crates/ring-channel",
    "crates/transferd-crypto",
    "crates/transferd-core",
    "crates/transferd",
    "crates/transferd-tests",
    "crates/relayd",
    "crates/transferd-ui",
    "crates/transferd-api",
    "crates/transferd-webrtc",
    "crates/transferd-mobile",
    "crates/launcher",
    "crates/transferd-tui",
    "crates/transferd-tui-video",
]
resolver = "2"

[workspace.dependencies]
bytes = "1"
async-trait = "0.1"
tokio = { version = "1", features = ["full"] }
blake3 = "1"
serde = { version = "1", features = ["derive"] }
bincode = "1"
nix = { version = "0.29", features = ["mman"] }
libc = "0.2"
thiserror = "2"
futures = "0.3"
rand = "0.8"
zeroize = "1"
eframe = { version = "0.28", default-features = true }
egui = "0.28"
tonic = "0.11"
prost = "0.12"
bip39 = "2"
ed25519-dalek = "2"
hex = "0.4"
image = { version = "0.25", default-features = false, features = ["png"] }
base64 = "0.22"
cpal    = "0.15"
nokhwa  = { version = "0.10", default-features = false }
aes-gcm = "0.10"
argon2  = "0.5"
dirs    = "5"
chrono  = { version = "0.4", default-features = false, features = ["clock"] }
