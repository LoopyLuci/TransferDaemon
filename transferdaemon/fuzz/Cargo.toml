[package]
name = "transferd-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bincode = "1"

[dependencies.relayd]
path = "../crates/relayd"

[dependencies.transferd]
path = "../crates/transferd"

[[bin]]
name = "fuzz_relay_protocol"
path = "fuzz_targets/fuzz_relay_protocol.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_handshake"
path = "fuzz_targets/fuzz_handshake.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_backup"
path = "fuzz_targets/fuzz_backup.rs"
test = false
doc = false
bench = false
