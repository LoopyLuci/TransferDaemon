syntax = "proto3";
package transferd;

// ---------------------------------------------------------------------------
// Account
// ---------------------------------------------------------------------------

service AccountService {
    rpc GetIdentity    (Empty)                   returns (IdentityReply);
    rpc CreateIdentity (CreateIdentityRequest)   returns (RecoveryPhraseReply);
    rpc RestoreIdentity(RestoreIdentityRequest)  returns (IdentityReply);
    rpc GetPublicKeyHex(Empty)                   returns (PublicKeyReply);
}

message Empty {}

message IdentityReply {
    bool   has_identity       = 1;
    string public_key         = 2;
    string display_name       = 3;
    // Hex-encoded 2624-byte hybrid public key: ed25519_pk ‖ ml_dsa_87_pk.
    // Empty on daemons that pre-date the quantum-resistant identity upgrade.
    string hybrid_public_key  = 4;
}

message CreateIdentityRequest { string display_name = 1; }
message RecoveryPhraseReply   { string phrase = 1; }
message RestoreIdentityRequest { string phrase = 1; }
message PublicKeyReply         { string hex = 1; }

// ---------------------------------------------------------------------------
// Friends / Contacts
// ---------------------------------------------------------------------------

service FriendService {
    rpc GetContacts (Empty)             returns (ContactList);
    rpc AddContact  (AddContactRequest) returns (ContactReply);
    rpc RenameContact (RenameContactRequest) returns (ContactReply);
    rpc RemoveContact (RemoveContactRequest) returns (Empty);
    rpc BlockContact  (BlockContactRequest)  returns (ContactReply);
    rpc UnblockContact (BlockContactRequest) returns (ContactReply);
    rpc GetSafetyNumber (SafetyNumberRequest) returns (SafetyNumberReply);
}

message SafetyNumberRequest { string contact_id = 1; }

message SafetyNumberReply {
    // The Signal-style out-of-band fingerprint. Empty when the peer's identity
    // has not yet been verified (no session established yet).
    string safety_number = 1;
    // Whether this is a verified fingerprint recorded at first contact.
    bool   verified      = 2;
}

message ContactReply {
    string id           = 1;
    string name         = 2;
    uint64 last_seen_ts = 3;
    bool   online       = 4;
    bool   blocked      = 5;
    // Whether the contact is currently typing (live indicator).
    bool   typing       = 6;
}

message ContactList { repeated ContactReply contacts = 1; }

message AddContactRequest {
    string public_key = 1;
    string name       = 2;
}

message RenameContactRequest {
    string contact_id = 1;
    string name       = 2;
}

message RemoveContactRequest { string contact_id = 1; }
message BlockContactRequest  { string contact_id = 1; }

// ---------------------------------------------------------------------------
// Groups
// ---------------------------------------------------------------------------

service GroupService {
    rpc CreateGroup   (CreateGroupRequest)   returns (GroupReply);
    rpc GetGroups     (Empty)                returns (GroupList);
    rpc GetGroup      (GetGroupRequest)      returns (GroupReply);
    rpc RenameGroup   (RenameGroupRequest)   returns (GroupReply);
    rpc AddMembers    (GroupMembersRequest)  returns (GroupReply);
    rpc RemoveMembers (GroupMembersRequest)  returns (GroupReply);
    rpc SetMemberRole (SetMemberRoleRequest) returns (GroupReply);
    rpc LeaveGroup    (GetGroupRequest)      returns (Empty);
    rpc DeleteGroup   (GetGroupRequest)      returns (Empty);
    rpc SendGroupText (SendGroupTextRequest) returns (MessageReply);
    rpc GetGroupMessages (GetGroupRequest)   returns (MessageList);
}

enum GroupRole {
    GROUP_ROLE_UNSPECIFIED = 0;
    GROUP_ROLE_OWNER       = 1;
    GROUP_ROLE_ADMIN       = 2;
    GROUP_ROLE_MEMBER      = 3;
}

message GroupMember {
    string     public_key = 1;
    GroupRole  role       = 2;
}

message GroupReply {
    string              group_id = 1;
    string              name     = 2;
    string              owner    = 3;
    repeated GroupMember members = 4;
    uint64              created_at = 5;
}

message GroupList { repeated GroupReply groups = 1; }

message CreateGroupRequest {
    string   name       = 1;
    repeated string member_ids = 2;
}

message GetGroupRequest { string group_id = 1; }
message RenameGroupRequest { string group_id = 1; string name = 2; }

message GroupMembersRequest {
    string          group_id   = 1;
    repeated string member_ids = 2;
}

message SetMemberRoleRequest {
    string    group_id  = 1;
    string    member_id = 2;
    GroupRole role      = 3;
}

message SendGroupTextRequest {
    string group_id = 1;
    string text     = 2;
}

// ---------------------------------------------------------------------------
// Connections (transport control center)
// ---------------------------------------------------------------------------

service ConnectionService {
    rpc ListConnections(Empty) returns (ConnectionList);
    rpc SetConnectionPolicy(SetConnectionPolicyRequest) returns (Empty);
    rpc StreamConnectionStatus(Empty) returns (stream ConnectionStatusMsg);
}

message Connection {
    string id             = 1;
    string name           = 2;
    // "wifi" | "ethernet" | "usb" | "bluetooth" | "vpn" | "proxy" | "relay" | "direct"
    string kind           = 3;
    bool   enabled        = 4;
    bool   online         = 5;
    uint64 link_speed_bps = 6;
    double rtt_ms         = 7;
    uint64 bandwidth_bps  = 8;
    // "auto" | "direct" | "relay" | "stripe"
    string policy         = 9;
}

message ConnectionList { repeated Connection connections = 1; }

message SetConnectionPolicyRequest {
    string connection_id = 1;
    string policy        = 2;
}

message ConnectionStatusMsg {
    string connection_id = 1;
    double rtt_ms        = 2;
    uint64 bandwidth_bps = 3;
    uint64 active_chunks = 4;
    bool   online        = 5;
}

// ---------------------------------------------------------------------------
// Messaging
// ---------------------------------------------------------------------------

service MessageService {
    rpc GetMessages (GetMessagesRequest) returns (MessageList);
    rpc SendText    (SendTextRequest)    returns (MessageReply);
    rpc SearchMessages (SearchMessagesRequest) returns (MessageList);
    rpc SendTyping  (SendTypingRequest)  returns (Empty);
    rpc ToggleReaction (ReactionRequest) returns (Empty);
}

message GetMessagesRequest { string contact_id = 1; }
message SearchMessagesRequest {
    string contact_id = 1;
    string query    = 2;
}

message SendTypingRequest {
    string contact_id = 1;
    bool   is_typing  = 2;
}

message ReactionRequest {
    string contact_id   = 1; // the thread (contact or group)
    string target_msg_id = 2;
    string emoji         = 3;
}

message MessageReply {
    string id           = 1;
    string contact_id   = 2;
    bool   outbound     = 3;
    string content_type = 4; // "text" | "file"
    string text         = 5; // set when content_type == "text"
    // file fields
    string file_name        = 6;
    uint64 file_size_bytes  = 7;
    uint64 file_transferred = 8;
    string file_mime        = 9;
    uint64 timestamp_ts     = 10;
    string status           = 11; // "pending" | "sent" | "delivered" | "read" | "failed"
    // group fields — set for messages in a group thread
    string group_id  = 12;
    string sender_pk = 13;
    // reply: id of the message this one quotes (same thread)
    string reply_to = 14;
    // reactions: repeated emoji | reactor pairs, aggregated
    repeated Reaction reactions = 15;
}

message Reaction {
    string emoji  = 1;
    string sender = 2;
}

message MessageList { repeated MessageReply messages = 1; }

message SendTextRequest {
    string contact_id = 1;
    string text       = 2;
    // id of the message being replied to (same thread), if any.
    string reply_to   = 3;
}

// ---------------------------------------------------------------------------
// File Transfer
// ---------------------------------------------------------------------------

service TransferService {
    rpc GetTransfers   (Empty)              returns (TransferList);
    rpc SendFile       (SendFileRequest)    returns (MessageReply);
    rpc CancelTransfer (CancelTransferRequest) returns (Empty);
    rpc PauseTransfer  (CancelTransferRequest) returns (Empty);
    rpc ResumeTransfer (CancelTransferRequest) returns (Empty);
}

message SendFileRequest {
    string contact_id = 1;
    string file_path  = 2;
    string file_name  = 3;
    uint64 file_size  = 4;
    string mime_type  = 5;
}

message TransferReply {
    string id               = 1;
    string contact_name     = 2;
    string file_name        = 3;
    uint64 size_bytes       = 4;
    uint64 transferred_bytes = 5;
    bool   outbound         = 6;
    uint32 lanes_active     = 7;
    uint64 bps              = 8;
}

message CancelTransferRequest { string transfer_id = 1; }

message TransferList { repeated TransferReply transfers = 1; }

// ---------------------------------------------------------------------------
// Settings
// ---------------------------------------------------------------------------

service SettingsService {
    rpc GetSetting (GetSettingRequest) returns (SettingReply);
    rpc SetSetting (SetSettingRequest) returns (Empty);
}

message GetSettingRequest { string key = 1; }
message SettingReply      { string value = 1; bool found = 2; }
message SetSettingRequest { string key = 1; string value = 2; }

// ---------------------------------------------------------------------------
// Calls (Phase 8 — WebRTC signaling over gRPC)
// ---------------------------------------------------------------------------
//
// SDP and ICE candidates are JSON-encoded strings opaque to the daemon.
// The daemon routes them between peers through the established session.

service CallService {
    rpc StartCall        (CallStartRequest)    returns (CallStartResponse);
    rpc AcceptCall       (CallAcceptRequest)   returns (CallAcceptResponse);
    rpc RejectCall       (CallRejectRequest)   returns (Empty);
    rpc EndCall          (CallEndRequest)      returns (Empty);
    rpc SendIceCandidate (IceCandidateMsg)     returns (Empty);
    rpc StreamCallEvents (Empty)               returns (stream CallEvent);
}

message CallStartRequest {
    string conv_id    = 1;
    bool   video      = 2;
    string local_sdp  = 3; // JSON-encoded SDP offer
}

message CallStartResponse {
    string call_id = 1;
}

message CallAcceptRequest {
    string call_id    = 1;
    string answer_sdp = 2; // JSON-encoded SDP answer
}

message CallAcceptResponse {
    bool   accepted    = 1;
    string remote_sdp  = 2; // SDP offer from the caller
}

message CallRejectRequest { string call_id = 1; }
message CallEndRequest    { string call_id = 1; }

message IceCandidateMsg {
    string call_id        = 1;
    string candidate_json = 2; // JSON: { candidate, sdpMid, sdpMLineIndex }
}

message CallEvent {
    string call_id    = 1;
    // "invite" | "accepted" | "rejected" | "ended" | "ice_candidate"
    string event_type = 2;
    string payload    = 3; // SDP for invite/accepted; JSON for ice_candidate; empty otherwise
    string conv_id    = 4;
    bool   video      = 5;
}

// ---------------------------------------------------------------------------
// Telemetry (Tier 1 instrumentation)
// ---------------------------------------------------------------------------

service TelemetryService {
    // Live event stream — clients receive events as they are emitted.
    rpc StreamTelemetry (Empty)              returns (stream TelemetryEventMsg);
    // Ring-buffer snapshot — returns all events currently in memory.
    rpc GetSnapshot     (Empty)              returns (TelemetrySnapshot);
}

message SystemHealthMsg {
    uint64 ts              = 1;
    float  cpu_pct         = 2;
    uint64 mem_rss_kb      = 3;
    uint64 uptime_secs     = 4;
    uint32 active_sessions = 5;
}

message AteLaneMsg {
    uint64 ts            = 1;
    bytes  session_hash  = 2; // first 8 bytes of 16-byte session ID
    uint64 gsn           = 3;
    uint32 selected_lane = 4;
    double rtt_ms        = 5;
    uint64 bandwidth_bps = 6;
    uint64 active_chunks = 7;
    uint32 total_lanes   = 8;
}

message TelemetryEventMsg {
    oneof event {
        SystemHealthMsg system_health = 1;
        AteLaneMsg      ate_lane      = 2;
    }
}

message TelemetrySnapshot {
    repeated TelemetryEventMsg events = 1;
}

// ---------------------------------------------------------------------------
// Updates (manual, opt-in — no automatic external traffic)
// ---------------------------------------------------------------------------

service UpdateService {
    rpc CheckForUpdates (Empty) returns (UpdateReply);
    rpc ApplyUpdate    (Empty) returns (Empty);
}

message UpdateReply {
    string current_version = 1;
    bool   has_update      = 2;
    string new_version     = 3;
    string release_notes   = 4;
    string download_url    = 5;
    string error           = 6;
}
