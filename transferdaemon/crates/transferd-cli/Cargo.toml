[package]
name = "transferd-cli"
version = "0.1.0"
edition = "2021"
description = "TransferDaemon from the command line, scripts and MCP clients (through the daemon's control hub)"

[[bin]]
name = "transferd-cli"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
transferd-control = { path = "../transferd-control", default-features = false }
serde_json = "1"
transferd-crypto = { path = "../transferd-crypto" }
transferd-cat = { path = "../transferd-cat" }
transferd-replica = { path = "../transferd-replica" }
tokio      = { workspace = true }
