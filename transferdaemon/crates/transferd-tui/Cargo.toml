[package]
name = "transferd-tui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "transferd-tui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
ratatui   = "0.27"
crossterm = "0.27"
tokio     = { workspace = true }
async-trait = { workspace = true }
thiserror   = { workspace = true }
serde       = { workspace = true }
rand        = { workspace = true }
bip39       = { workspace = true }
ed25519-dalek = { workspace = true }
hex         = { workspace = true }
tonic       = { workspace = true }
tracing     = { workspace = true }
transferd-api      = { path = "../transferd-api" }
# Driven from outside through the daemon's control hub (tui.* operations).
transferd-control  = { path = "../transferd-control", default-features = false }
serde_json = "1"
transferd-tui-video = { path = "../transferd-tui-video" }
transferd-webrtc    = { path = "../transferd-webrtc", features = ["desktop-capture"] }
image  = { workspace = true }
qrcode = "0.14"
base64 = { workspace = true }

