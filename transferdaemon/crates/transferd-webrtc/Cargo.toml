[package]
name = "transferd-webrtc"
version = "0.1.0"
edition = "2021"

[lints]
workspace = true

[dependencies]
tokio        = { workspace = true }
async-trait  = { workspace = true }
thiserror    = { workspace = true }
serde        = { workspace = true }
serde_json   = "1"
tonic        = { version = "0.11", optional = true }
transferd-api = { path = "../transferd-api", optional = true }
cpal         = { workspace = true, optional = true }
webrtc       = { version = "0.12", optional = true }
webrtc-util  = { version = "0.9", optional = true }
bytes        = { workspace = true }
tracing      = { workspace = true }

[features]
default      = ["real-webrtc"]
grpc-signaling   = ["tonic", "transferd-api"]
desktop-capture  = ["cpal", "nokhwa"]
real-webrtc      = ["webrtc", "webrtc-util"]

[target.'cfg(target_os = "windows")'.dependencies]
nokhwa = { workspace = true, features = ["input-msmf"],  optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
nokhwa = { workspace = true, features = ["input-v4l"],   optional = true }

[target.'cfg(target_os = "macos")'.dependencies]
nokhwa = { workspace = true, features = ["input-avfoundation"], optional = true }

[dev-dependencies]
tokio-stream = { version = "0.1", features = ["net", "sync"] }
serde_json   = "1"

