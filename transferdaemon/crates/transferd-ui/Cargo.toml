[package]
name = "transferd-ui"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "transferd-ui"
path = "src/main.rs"

[lints]
workspace = true

[dependencies]
eframe        = { workspace = true }
# serde: egui's Id is rebuilt from AccessKit node ids through its serde form (automation.rs).
egui          = { workspace = true, features = ["serde"] }
tokio         = { workspace = true }
tracing       = { workspace = true }
tray-icon     = { workspace = true }

transferd-ui-shared = { path = "../transferd-ui-shared" }
# The window can be driven from outside (gui.* operations of the daemon's control hub).
transferd-control   = { path = "../transferd-control", default-features = false }
serde_json          = "1"
image               = { workspace = true }
base64              = { workspace = true }

